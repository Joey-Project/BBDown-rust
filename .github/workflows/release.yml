name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the workflow ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/bbdown
            package_suffix: linux-x86_64
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/bbdown
            package_suffix: macos-x86_64
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/bbdown
            package_suffix: macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/bbdown.exe
            package_suffix: windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p bbdown-cli --bin bbdown --release --locked --target ${{ matrix.target }}

      - name: Compute package name
        id: package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION#refs/tags/}"
          version="${version#refs/heads/}"
          version="${version//\//-}"
          echo "name=bbdown-${version}-${{ matrix.package_suffix }}" >> "${GITHUB_OUTPUT}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release.sh "${{ matrix.binary }}" "${{ steps.package.outputs.name }}" dist

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -BinaryPath "${{ matrix.binary }}" `
            -PackageName "${{ steps.package.outputs.name }}" `
            -OutputDir dist

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.${{ matrix.archive_ext }}
            dist/${{ steps.package.outputs.name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
