name: Create Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Final SemVer version without the leading v, for example 0.1.0."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.meta.outputs.rc_tag }}
      final_tag: ${{ steps.meta.outputs.final_tag }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          ensure_release_absent() {
            local tag=$1
            local error_file
            error_file=$(mktemp)
            if gh api "repos/${repo}/releases/tags/${tag}" >/dev/null 2>"${error_file}"; then
              echo "::error::GitHub Release ${tag} already exists; create a new version instead"
              exit 2
            fi
            if ! grep -q "HTTP 404" "${error_file}"; then
              echo "::error::failed to check GitHub Release ${tag}: $(tr '\n' ' ' < "${error_file}")"
              exit 2
            fi
          }
          ensure_tag_absent() {
            local tag=$1
            local error_file
            error_file=$(mktemp)
            if gh api "repos/${repo}/git/ref/tags/${tag}" >/dev/null 2>"${error_file}"; then
              echo "::error::final tag ${tag} already exists; create a new version instead"
              exit 2
            fi
            if ! grep -q "HTTP 404" "${error_file}"; then
              echo "::error::failed to check tag ${tag}: $(tr '\n' ' ' < "${error_file}")"
              exit 2
            fi
          }
          list_matching_refs() {
            local prefix=$1
            local error_file
            error_file=$(mktemp)
            if refs=$(gh api --paginate "repos/${repo}/git/matching-refs/tags/${prefix}" --jq '.[].ref' 2>"${error_file}"); then
              printf '%s\n' "${refs}"
              return
            fi
            if grep -q "HTTP 404" "${error_file}"; then
              return
            fi
            echo "::error::failed to list matching tags for ${prefix}: $(tr '\n' ' ' < "${error_file}")"
            exit 2
          }
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo "::error::repository default branch is not available"
            exit 2
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::release candidates must be created from the default branch ${DEFAULT_BRANCH}; current ref is ${GITHUB_REF}"
            exit 2
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH without a leading v: ${VERSION}"
            exit 2
          fi
          cargo_versions=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); versions = {pkg["name"]: pkg["version"] for pkg in data["packages"]}; print(versions["bbdown-core"]); print(versions["bbdown-cli"])')
          core_version=$(printf '%s\n' "${cargo_versions}" | sed -n '1p')
          cli_version=$(printf '%s\n' "${cargo_versions}" | sed -n '2p')
          if [[ "${core_version}" != "${VERSION}" ]]; then
            echo "::error::bbdown-core version ${core_version} does not match requested release ${VERSION}"
            exit 2
          fi
          if [[ "${cli_version}" != "${VERSION}" ]]; then
            echo "::error::bbdown-cli version ${cli_version} does not match requested release ${VERSION}"
            exit 2
          fi
          final_tag="v${VERSION}"
          ensure_release_absent "${final_tag}"
          ensure_tag_absent "${final_tag}"
          rc_prefix="v${VERSION}-rc."
          version_regex="${VERSION//./\\.}"
          max_rc=0
          refs=$(list_matching_refs "${rc_prefix}")
          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            if [[ "${tag}" =~ ^v${version_regex}-rc\.([1-9][0-9]*)$ ]]; then
              current_rc="${BASH_REMATCH[1]}"
              if (( current_rc > max_rc )); then
                max_rc="${current_rc}"
              fi
            fi
          done <<< "${refs}"
          rc_number=$((max_rc + 1))
          target_sha=$(git rev-parse HEAD)
          rc_tag="v${VERSION}-rc.${rc_number}"
          {
            echo "rc_tag=${rc_tag}"
            echo "final_tag=${final_tag}"
            echo "target_sha=${target_sha}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install declared MSRV
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check declared MSRV
        run: cargo +1.95.0 check --workspace --locked

      - name: Unit and e2e tests
        run: cargo test --workspace

      - name: Crate publish dry run
        run: cargo publish --dry-run -p bbdown-core --locked

  build-artifacts:
    name: Build release candidate artifacts
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.target_sha }}
      package_version: ${{ needs.validate.outputs.rc_tag }}

  create-tag:
    name: Create release candidate tag
    needs:
      - validate
      - build-artifacts
    runs-on: ubuntu-latest
    environment: release-candidate
    permissions:
      contents: write
    steps:
      # actions/create-github-app-token@v2
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create annotated RC tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RC_TAG: ${{ needs.validate.outputs.rc_tag }}
          FINAL_TAG: ${{ needs.validate.outputs.final_tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          ensure_release_absent() {
            local tag=$1
            local error_file
            error_file=$(mktemp)
            if gh api "repos/${repo}/releases/tags/${tag}" >/dev/null 2>"${error_file}"; then
              echo "::error::GitHub Release ${tag} already exists; create a new version instead"
              exit 2
            fi
            if ! grep -q "HTTP 404" "${error_file}"; then
              echo "::error::failed to check GitHub Release ${tag}: $(tr '\n' ' ' < "${error_file}")"
              exit 2
            fi
          }
          ensure_tag_absent() {
            local tag=$1
            local exists_message=$2
            local error_file
            error_file=$(mktemp)
            if gh api "repos/${repo}/git/ref/tags/${tag}" >/dev/null 2>"${error_file}"; then
              echo "::error::${exists_message}"
              exit 2
            fi
            if ! grep -q "HTTP 404" "${error_file}"; then
              echo "::error::failed to check tag ${tag}: $(tr '\n' ' ' < "${error_file}")"
              exit 2
            fi
          }
          ensure_release_absent "${FINAL_TAG}"
          ensure_tag_absent "${FINAL_TAG}" "final tag ${FINAL_TAG} already exists; create a new version instead"
          ensure_tag_absent "${RC_TAG}" "tag ${RC_TAG} already exists"
          tag_sha=$(gh api --method POST "repos/${repo}/git/tags" \
            -f tag="${RC_TAG}" \
            -f message="Release candidate ${RC_TAG}" \
            -f object="${TARGET_SHA}" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/${repo}/git/refs" \
            -f ref="refs/tags/${RC_TAG}" \
            -f sha="${tag_sha}" >/dev/null
          echo "Created ${RC_TAG} at ${TARGET_SHA}"
