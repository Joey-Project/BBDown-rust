name: Codex Review Gate Verifier
run-name: codex-review-gate-verifier/${{ github.event.pull_request.number }}/${{ github.sha }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-gate-verifier-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review-gate:
    name: codex/github-review-gate
    runs-on: ${{ vars.CODEX_REVIEW_GATE_USE_UBUNTU_LATEST == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 14
    steps:
      - name: Verify Codex review evidence
        id: gate
        uses: JoeyTeng/codex-review-gate-action@v2
        env:
          CODEX_REVIEW_GATE_REQUEST_AUTHOR_PERMISSION: any
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number }}
          expected_head_sha: ${{ github.event.pull_request.head.sha }}
          operation: reconcile
          request_review: false
          limits_profile: ${{ vars.CODEX_REVIEW_GATE_LIMITS_PROFILE == 'expanded' && 'expanded' || 'default' }}
