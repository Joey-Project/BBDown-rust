name: Promote Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Final SemVer version without the leading v, matching the selected RC tag."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate tag
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.meta.outputs.rc_tag }}
      final_tag: ${{ steps.meta.outputs.final_tag }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH without a leading v: ${REQUESTED_VERSION}"
            exit 2
          fi
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::release promotion must be run from an RC tag; current ref is ${GITHUB_REF}"
            exit 2
          fi
          rc_tag="${GITHUB_REF_NAME}"
          if [[ ! "${rc_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([1-9][0-9]*)$ ]]; then
            echo "::error::release promotion ref must match vMAJOR.MINOR.PATCH-rc.N: ${rc_tag}"
            exit 2
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [[ "${version}" != "${REQUESTED_VERSION}" ]]; then
            echo "::error::selected RC tag ${rc_tag} does not match requested version ${REQUESTED_VERSION}"
            exit 2
          fi
          selected_rc="${BASH_REMATCH[4]}"
          final_tag="v${version}"
          rc_prefix="v${version}-rc."
          version_regex="${version//./\\.}"
          list_matching_refs() {
            local prefix=$1
            local error_file
            error_file=$(mktemp)
            if refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${prefix}" --jq '.[].ref' 2>"${error_file}"); then
              printf '%s\n' "${refs}"
              return
            fi
            if grep -q "HTTP 404" "${error_file}"; then
              return
            fi
            echo "::error::failed to list matching tags for ${prefix}: $(tr '\n' ' ' < "${error_file}")"
            exit 2
          }
          max_rc=0
          refs=$(list_matching_refs "${rc_prefix}")
          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            if [[ "${tag}" =~ ^v${version_regex}-rc\.([1-9][0-9]*)$ ]]; then
              current_rc="${BASH_REMATCH[1]}"
              if (( current_rc > max_rc )); then
                max_rc="${current_rc}"
              fi
            fi
          done <<< "${refs}"
          if (( selected_rc != max_rc )); then
            echo "::error::release promotion must use the latest RC tag for ${final_tag}; selected ${rc_tag}, latest is v${version}-rc.${max_rc}"
            exit 2
          fi
          cargo_versions=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); versions = {pkg["name"]: pkg["version"] for pkg in data["packages"]}; print(versions["bbdown-core"]); print(versions["bbdown-cli"])')
          core_version=$(printf '%s\n' "${cargo_versions}" | sed -n '1p')
          cli_version=$(printf '%s\n' "${cargo_versions}" | sed -n '2p')
          if [[ "${core_version}" != "${version}" ]]; then
            echo "::error::bbdown-core version ${core_version} does not match release tag ${final_tag}"
            exit 2
          fi
          if [[ "${cli_version}" != "${version}" ]]; then
            echo "::error::bbdown-cli version ${cli_version} does not match release tag ${final_tag}"
            exit 2
          fi
          target_sha=$(git rev-list -n 1 "${rc_tag}")
          {
            echo "rc_tag=${rc_tag}"
            echo "final_tag=${final_tag}"
            echo "target_sha=${target_sha}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install declared MSRV
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check declared MSRV
        run: cargo +1.95.0 check --workspace --locked

      - name: Unit and e2e tests
        run: cargo test --workspace

      - name: Crate publish dry run
        run: cargo publish --dry-run -p bbdown-core --locked

  build-artifacts:
    name: Build final release artifacts
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.target_sha }}
      package_version: ${{ needs.validate.outputs.final_tag }}

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - validate
      - build-artifacts
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      # actions/create-github-app-token@v2
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RC_TAG: ${{ needs.validate.outputs.rc_tag }}
          FINAL_TAG: ${{ needs.validate.outputs.final_tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          rc_prefix="${FINAL_TAG}-rc."
          version_regex="${VERSION//./\\.}"
          selected_rc="${RC_TAG##*.}"
          list_matching_refs() {
            local prefix=$1
            local error_file
            error_file=$(mktemp)
            if refs=$(gh api --paginate "repos/${repo}/git/matching-refs/tags/${prefix}" --jq '.[].ref' 2>"${error_file}"); then
              printf '%s\n' "${refs}"
              return
            fi
            if grep -q "HTTP 404" "${error_file}"; then
              return
            fi
            echo "::error::failed to list matching tags for ${prefix}: $(tr '\n' ' ' < "${error_file}")"
            exit 2
          }
          max_rc=0
          refs=$(list_matching_refs "${rc_prefix}")
          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            if [[ "${tag}" =~ ^v${version_regex}-rc\.([1-9][0-9]*)$ ]]; then
              current_rc="${BASH_REMATCH[1]}"
              if (( current_rc > max_rc )); then
                max_rc="${current_rc}"
              fi
            fi
          done <<< "${refs}"
          if (( selected_rc != max_rc )); then
            echo "::error::release promotion must use the latest RC tag for ${FINAL_TAG}; selected ${RC_TAG}, latest is v${VERSION}-rc.${max_rc}"
            exit 2
          fi
          release_error=$(mktemp)
          if gh api "repos/${repo}/releases/tags/${FINAL_TAG}" >/dev/null 2>"${release_error}"; then
            echo "::error::GitHub Release ${FINAL_TAG} already exists"
            exit 2
          fi
          if ! grep -q "HTTP 404" "${release_error}"; then
            echo "::error::failed to check GitHub Release ${FINAL_TAG}: $(tr '\n' ' ' < "${release_error}")"
            exit 2
          fi
          mapfile -t assets < <(find dist -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::no release assets were downloaded"
            exit 2
          fi
          tag_ref_error=$(mktemp)
          if tag_ref_json=$(gh api "repos/${repo}/git/ref/tags/${FINAL_TAG}" 2>"${tag_ref_error}"); then
            tag_object_type=$(printf '%s' "${tag_ref_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["type"])')
            tag_object_sha=$(printf '%s' "${tag_ref_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])')
            if [[ "${tag_object_type}" == "tag" ]]; then
              tag_target_sha=$(gh api "repos/${repo}/git/tags/${tag_object_sha}" --jq .object.sha)
            else
              tag_target_sha="${tag_object_sha}"
            fi
            if [[ "${tag_target_sha}" != "${TARGET_SHA}" ]]; then
              echo "::error::tag ${FINAL_TAG} points to ${tag_target_sha}, expected ${TARGET_SHA}"
              exit 2
            fi
            echo "Reusing existing ${FINAL_TAG} tag at ${TARGET_SHA}"
          else
            if ! grep -q "HTTP 404" "${tag_ref_error}"; then
              echo "::error::failed to check tag ${FINAL_TAG}: $(tr '\n' ' ' < "${tag_ref_error}")"
              exit 2
            fi
            tag_sha=$(gh api --method POST "repos/${repo}/git/tags" \
              -f tag="${FINAL_TAG}" \
              -f message="Release ${FINAL_TAG}" \
              -f object="${TARGET_SHA}" \
              -f type=commit \
              --jq .sha)
            gh api --method POST "repos/${repo}/git/refs" \
              -f ref="refs/tags/${FINAL_TAG}" \
              -f sha="${tag_sha}" >/dev/null
          fi
          gh release create "${FINAL_TAG}" "${assets[@]}" \
            --repo "${repo}" \
            --target "${TARGET_SHA}" \
            --verify-tag \
            --generate-notes

  publish-crate:
    name: Publish bbdown-core to crates.io
    needs:
      - validate
      - publish-github-release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bbdown-core --locked --token "${CARGO_REGISTRY_TOKEN}"
