name: Promote Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate tag
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.meta.outputs.rc_tag }}
      final_tag: ${{ steps.meta.outputs.final_tag }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # dtolnay/rust-toolchain@master
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Validate release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::release promotion must be run from an RC tag; current ref is ${GITHUB_REF}"
            exit 2
          fi
          rc_tag="${GITHUB_REF_NAME}"
          if [[ ! "${rc_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([1-9][0-9]*)$ ]]; then
            echo "::error::release promotion ref must match vMAJOR.MINOR.PATCH-rc.N: ${rc_tag}"
            exit 2
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          final_tag="v${version}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(pkg["version"] for pkg in data["packages"] if pkg["name"] == "bbdown-core"))')
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "::error::bbdown-core version ${cargo_version} does not match release tag ${final_tag}"
            exit 2
          fi
          target_sha=$(git rev-list -n 1 "${rc_tag}")
          {
            echo "rc_tag=${rc_tag}"
            echo "final_tag=${final_tag}"
            echo "target_sha=${target_sha}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and e2e tests
        run: cargo test --workspace

      - name: Crate publish dry run
        run: cargo publish --dry-run -p bbdown-core --locked

  build-artifacts:
    name: Build final release artifacts
    needs: validate
    uses: ./.github/workflows/release.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.target_sha }}
      package_version: ${{ needs.validate.outputs.final_tag }}

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - validate
      - build-artifacts
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      # actions/create-github-app-token@v2
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FINAL_TAG: ${{ needs.validate.outputs.final_tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          if gh api "repos/${repo}/git/ref/tags/${FINAL_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${FINAL_TAG} already exists"
            exit 2
          fi
          if gh release view "${FINAL_TAG}" --repo "${repo}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${FINAL_TAG} already exists"
            exit 2
          fi
          mapfile -t assets < <(find dist -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::no release assets were downloaded"
            exit 2
          fi
          tag_sha=$(gh api --method POST "repos/${repo}/git/tags" \
            -f tag="${FINAL_TAG}" \
            -f message="Release ${FINAL_TAG}" \
            -f object="${TARGET_SHA}" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/${repo}/git/refs" \
            -f ref="refs/tags/${FINAL_TAG}" \
            -f sha="${tag_sha}" >/dev/null
          gh release create "${FINAL_TAG}" "${assets[@]}" \
            --repo "${repo}" \
            --target "${TARGET_SHA}" \
            --verify-tag \
            --generate-notes

  publish-crate:
    name: Publish bbdown-core to crates.io
    needs:
      - validate
      - publish-github-release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      # dtolnay/rust-toolchain@master
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bbdown-core --locked --token "${CARGO_REGISTRY_TOKEN}"
