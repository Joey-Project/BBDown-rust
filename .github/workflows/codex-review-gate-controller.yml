name: Codex Review Gate Controller

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Codex Review Gate Verifier]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run for one pull request
        required: true
        type: choice
        options:
          - reconcile
          - begin-review
        default: reconcile
      pr_number:
        description: Pull request number
        required: true
        type: number
      expected_head_sha:
        description: Exact current 40-character pull request head SHA
        required: true
        type: string
      request_comment_id:
        description: Optional GitHub comment ID used only as an evidence hint
        required: false
        type: string
      request_review:
        description: Post a fresh Codex request during begin-review; ignored during reconcile
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-gate-controller-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  codex-review-gate-controller:
    name: codex/review-gate-controller
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.pull_request &&
          github.event.sender.login == 'chatgpt-codex-connector[bot]' &&
          github.event.sender.type == 'Bot' &&
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.user.type == 'Bot'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.action == 'completed' &&
          (
            github.event.workflow_run.path == '.github/workflows/codex-review-gate.yml' ||
            (
              startsWith(github.event.workflow_run.path, '.github/workflows/codex-review-gate.yml@refs/pull/') &&
              endsWith(github.event.workflow_run.path, '/merge')
            )
          ) &&
          github.event.workflow_run.event == 'pull_request' &&
          !github.event.workflow_run.pull_requests[1]
        )
      }}
    runs-on: ${{ vars.CODEX_REVIEW_GATE_USE_UBUNTU_LATEST == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 14
    steps:
      - name: Refresh Codex review gate
        id: controller
        uses: JoeyTeng/codex-review-gate-action@v2
        env:
          CODEX_REVIEW_GATE_REQUEST_AUTHOR_PERMISSION: any
          CODEX_REVIEW_GATE_AUTO_REQUEST: ${{ vars.CODEX_REVIEW_GATE_AUTO_REQUEST }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.pull_requests[0].number || '0') || github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number }}
          expected_head_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || '' }}
          operation: ${{ github.event_name == 'workflow_run' && vars.CODEX_REVIEW_GATE_AUTO_REQUEST == 'true' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0].number && !github.event.workflow_run.pull_requests[1] && 'begin-review' || github.event_name == 'workflow_run' && 'report-completion' || github.event_name == 'workflow_dispatch' && inputs.operation || 'reconcile' }}
          request_comment_id: ${{ github.event_name == 'issue_comment' && github.event.comment.id || github.event_name == 'workflow_dispatch' && inputs.request_comment_id || '' }}
          request_review: ${{ github.event_name == 'workflow_run' && vars.CODEX_REVIEW_GATE_AUTO_REQUEST == 'true' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0].number && !github.event.workflow_run.pull_requests[1] || github.event_name == 'workflow_dispatch' && inputs.request_review || false }}
          limits_profile: ${{ vars.CODEX_REVIEW_GATE_LIMITS_PROFILE == 'expanded' && 'expanded' || 'default' }}
