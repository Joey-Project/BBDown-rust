[workspace]
members = [
    "crates/bbdown",
    "crates/bbdown-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/JoeyTeng/BBDown-rust"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
anyhow = "1.0.99"
assert_cmd = "2.0.17"
async-trait = "0.1.89"
clap = { version = "4.5.47", features = ["derive", "env"] }
dirs = "6.0.0"
httpmock = "0.8.0-alpha.1"
md-5 = "0.10.6"
predicates = "3.1.3"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "gzip", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.7"
